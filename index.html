<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marmik Soni – Coming Soon</title>
  <meta name="description" content="Designing modern and engaging digital experiences for brands and businesses.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Preload critical fonts to eliminate FOUT -->
  <link rel="preload" href="fonts/Trap-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="fonts/Trap-Medium.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="editorial-layout">
    <div class="top-section">
      <div class="top-left">
        <div class="reveal-wrap">
          <h1 class="subtext reveal-text">New portfolio arriving soon.<br>Available for new opportunities.</h1>
        </div>
      </div>
      
      <div class="top-right">
        <div class="reveal-wrap delay-1">
          <nav class="social-nav reveal-text">
            <a href="#" class="social-link">Instagram</a>
            <a href="https://linkedin.com/in/marmiksoni" target="_blank" rel="noopener noreferrer" class="social-link">LinkedIn</a>
            <a href="#" class="social-link">Twitter</a>
            <a href="#" onclick="copyEmail(event)" class="social-link">Email</a>
          </nav>
        </div>
      </div>
    </div>
    
    <div class="bottom-section">
      <div class="giant-text-wrap reveal-wrap delay-1">
        <h2 class="giant-text reveal-text">Marmik Soni</h2>
      </div>
    </div>
  </main>

  <div class="custom-cursor hidden" id="custom-cursor"></div>

  <script>
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    // Advanced Cursor Logic
    const cursor = document.getElementById('custom-cursor');
    if (cursor) {
      let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      let pos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      let scale = 0;
      let angle = 0;
      let isVisible = false;

      const updateMouse = (x, y) => {
        mouse.x = x;
        mouse.y = y;
        if (!isVisible) {
          pos.x = x;
          pos.y = y;
          cursor.classList.remove('hidden');
          isVisible = true;
        }
      };

      window.addEventListener('mousemove', (e) => updateMouse(e.clientX, e.clientY));
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) updateMouse(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) updateMouse(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      window.addEventListener('touchend', () => {
        cursor.classList.add('hidden');
        isVisible = false;
      });

      document.addEventListener('mouseleave', () => {
        cursor.classList.add('hidden');
        isVisible = false;
      });

      document.addEventListener('mouseenter', (e) => {
        updateMouse(e.clientX, e.clientY);
      });

      const loop = () => {
        // Lag effect (lower is more laggy)
        pos.x += (mouse.x - pos.x) * 0.15;
        pos.y += (mouse.y - pos.y) * 0.15;

        // Velocity stretch effect
        const dx = mouse.x - pos.x;
        const dy = mouse.y - pos.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        scale = Math.min(distance * 0.005, 0.5); // max 1.5x stretch

        if (distance > 1) {
          angle = Math.atan2(dy, dx);
        }

        const sx = 1 + scale;
        const sy = 1 - scale * 0.5;

        cursor.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0) translate(-50%, -50%) rotate(${angle}rad) scale(${sx}, ${sy})`;
        requestAnimationFrame(loop);
      };

      requestAnimationFrame(loop);

      const hoverTargets = document.querySelectorAll('a, button');
      hoverTargets.forEach(target => {
        target.addEventListener('mouseenter', () => cursor.classList.add('hovering'));
        target.addEventListener('mouseleave', () => cursor.classList.remove('hovering'));
      });
    }

    // Magnetic Button Logic
    const magneticButton = document.querySelector('.email-button');
    if (magneticButton && !isTouch) {
      magneticButton.addEventListener('mousemove', (e) => {
        const rect = magneticButton.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        magneticButton.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
      });

      magneticButton.addEventListener('mouseleave', () => {
        magneticButton.style.transform = `translate(0px, 0px)`;
      });
    }

    // Footer removed

    function copyEmail(e) {
      e.preventDefault();
      var email = 'hello@marmiksoni.co';
      var target = e.currentTarget;
      var originalText = target.textContent;

      var showSuccess = function () {
        target.textContent = 'copied!';
        setTimeout(function () {
          target.textContent = originalText;
        }, 2000);
      };

      if (!navigator.clipboard || window.isSecureContext === false) {
        var textArea = document.createElement('textarea');
        textArea.value = email;
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        textArea.style.top = '-999999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showSuccess();
        } catch (err) {
          console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textArea);
        return;
      }

      navigator.clipboard.writeText(email).then(function () {
        showSuccess();
      }).catch(function (err) {
        console.error('Clipboard copy failed', err);
      });
    }

  </script>

</body>
</html>
