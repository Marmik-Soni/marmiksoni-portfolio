<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marmik Soni – Coming Soon</title>
  <meta name="description" content="Designing modern and engaging digital experiences for brands and businesses.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Preload critical fonts to eliminate FOUT -->
  <link rel="preload" href="fonts/Trap-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="fonts/Trap-Medium.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="name-block">
      <span class="contact-label">Designer &amp; Developer</span>
      <a href="https://linkedin.com/in/marmiksoni" target="_blank" rel="noopener noreferrer" class="bar-name" aria-label="Marmik Soni on LinkedIn">
        <span class="bar-name-text">Marmik Soni</span>
      </a>
    </div>
    <div class="contact-block">
      <span class="contact-label">Drop me a line</span>
      <button class="email-button" onclick="copyEmail()" aria-label="Copy email address">
        <span class="email-text">hello@marmiksoni.co</span>
      </button>
    </div>
  </header>

  <main>
    <h1>Coming Soon</h1>
    <p>Currently cooking up a brand new web experience. Please stand by.</p>
  </main>

  <footer>
  </footer>

  <div class="toast" id="toast">Email copied to clipboard</div>

  <script>
    function copyEmail() {
      var email = 'hello@marmiksoni.co';

      var showToast = function () {
        var toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(function () {
          toast.classList.remove('show');
        }, 2500);
      };

      // Fallback for HTTP / Mobile Safari
      if (!navigator.clipboard || window.isSecureContext === false) {
        var textArea = document.createElement('textarea');
        textArea.value = email;
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        textArea.style.top = '-999999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showToast();
        } catch (err) {
          console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textArea);
        return;
      }

      // Modern HTTPS
      navigator.clipboard.writeText(email).then(function () {
        showToast();
      }).catch(function (err) {
        console.error('Clipboard copy failed', err);
      });
    }
  </script>

</body>
</html>
